<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex">
<title>Bogenliga Auswertung</title>
<style>
:root{--blau:#1f4e79;--rand:#c9d3dd;--bg:#f3f6f9;--grau:#5a6b7b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1b2733}
header{background:var(--blau);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 0 8px;font-weight:600}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:transparent;color:#cfe0f0;padding:10px 4px;font-size:15px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--blau)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{font-size:12px;color:var(--grau);font-weight:600;text-align:right;padding:5px 5px;border-bottom:2px solid var(--rand);white-space:nowrap}
table.t td{padding:6px 5px;text-align:right;border-bottom:1px solid #e6ecf1;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:#fff}
table.t tfoot td{font-weight:600;border-top:2px solid var(--rand);border-bottom:0}
table.t td.nm{color:var(--blau);cursor:pointer;text-decoration:underline;text-decoration-color:#9db4c9;text-underline-offset:3px}
input[type=password],select{width:100%;padding:10px;border:1px solid var(--rand);border-radius:6px;font-size:16px;background:#fff}
button.b{border:0;border-radius:8px;background:var(--blau);color:#fff;padding:11px 16px;font-size:15px;margin-top:8px;cursor:pointer}
button.b.sek{background:#e6edf4;color:var(--blau)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>div{flex:1}
.row label,.klein{font-size:12px;color:var(--grau)}
.fehler{color:#c62828;font-weight:600;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
details{border-top:1px solid #e6ecf1;padding:6px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;padding:4px 0}
summary small{font-weight:400;color:var(--grau)}
.erg{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
footer{padding:4px 12px 24px;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="titel">Bayernliga · Auswertung</h1>
  <nav id="nav" hidden>
    <button data-tab="schuetzen" class="on">Schützen</button>
    <button data-tab="spieltage">Spieltage</button>
    <button data-tab="diagramme">Diagramme</button>
  </nav>
</header>
<main>
  <section id="login" class="card">
    <h2>Zugang</h2>
    <p class="klein" style="font-size:14px">Bitte das Passwort eingeben, das du von deinem Mannschaftsführer bekommen hast.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort">
    <label style="display:block;margin-top:8px;font-size:14px"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
    <button class="b" id="btnLogin">Öffnen</button>
    <div id="loginMsg" class="fehler"></div>
  </section>

  <div id="app" hidden>
    <section id="tab-schuetzen">
      <div class="card"><h2>Ringe je Spieltag</h2><div class="scroll" id="tRinge"></div></div>
      <div class="card"><h2>Ø Ringe je Pfeil</h2><div class="scroll" id="tSchnitt"></div>
        <div class="klein" style="margin-top:6px">„Gesamt“ ist der Mittelwert der Spieltagsschnitte.</div></div>
      <div class="card"><h2>Statistik</h2><div class="scroll" id="tStat"></div>
        <div class="klein" id="satzInfo" style="margin-top:6px"></div></div>
    </section>
    <section id="tab-spieltage" hidden><div id="spieltage"></div></section>
    <section id="tab-diagramme" hidden>
      <div class="card"><h2>Verlauf eines Matches</h2>
        <div class="row"><div><label for="selTag">Spieltag</label><select id="selTag"></select></div><div><label for="selMatch">Match</label><select id="selMatch"></select></div></div>
        <div id="chMatch"></div></div>
      <div class="card"><h2>Ø Ringe je Pfeil nach Spieltag</h2><div id="chTage"></div></div>
      <div class="card"><h2>Pfeilverteilung</h2>
        <label class="klein" for="selSchuetze">Schütze</label><select id="selSchuetze"></select>
        <div id="chVert" style="margin-top:8px"></div><div class="klein" id="vertInfo"></div></div>
    </section>
    <button class="b sek" id="btnLogout" style="margin-top:0">Abmelden</button>
  </div>
</main>
<footer class="klein" id="foot"></footer>

<script>
/* Auswertung der Saison: bildet das Excel-Makro "Ergebnisberechnung" nach (mit korrigiertem Gesamtschnitt). */
(function (root) {
  'use strict';
  const Calc = {};
  const TAGE = [1, 2, 3, 4];
  /* VBA-Round: bei exakter Hälfte auf die gerade Stelle (z. B. 8,625 -> 8,62), sonst normal */
  const r2 = x => {
    const y = x * 100, f = Math.floor(y);
    if (y - f === 0.5) return (f % 2 === 0 ? f : f + 1) / 100;
    return Math.round(y) / 100;
  };

  /* matches: [{tag, matchNr, gegner, own:{setTotals,setPoints,matchPoints}, opp:{...}, shooters:[{nr, sets:[[a,b],...]}]}]
     schuetzen: [{nr, name}] (Reihenfolge wie in der Tabelle) */
  Calc.compute = function (matches, schuetzen) {
    const list = (schuetzen || []).map(s => ({ nr: +s.nr, name: s.name || ('Nr. ' + s.nr) }));
    const known = new Set(list.map(s => s.nr));
    matches.forEach(m => m.shooters.forEach(S => { if (!known.has(+S.nr)) { known.add(+S.nr); list.push({ nr: +S.nr, name: 'Nr. ' + S.nr }); } }));

    const st = {};
    list.forEach(s => { st[s.nr] = { ringe: [0, 0, 0, 0], pfeile: [0, 0, 0, 0], misses: 0, matches: 0, dist: new Array(11).fill(0) }; });
    const satzTag = [0, 0, 0, 0];

    matches.forEach(m => {
      const ti = m.tag - 1; if (ti < 0 || ti > 3) return;
      m.shooters.forEach((S, idx) => {
        const o = st[+S.nr]; if (!o) return;
        let counted = false;
        S.sets.forEach(set => set.forEach(v => {
          if (v == null) return;
          o.ringe[ti] += v; o.pfeile[ti]++; o.dist[v]++; counted = true;
          if (v === 0) o.misses++;
        }));
        if (counted) o.matches++;
        if (idx === 0) S.sets.forEach(set => { if (set[0] != null) satzTag[ti]++; });
      });
    });

    const rows = list.map(s => {
      const o = st[s.nr];
      const ringe = o.ringe.map(v => (v > 0 ? v : null));
      const avg = o.ringe.map((v, i) => (v > 0 ? r2(v / o.pfeile[i]) : null));
      const ringeSum = o.ringe.reduce((a, b) => a + (b > 0 ? b : 0), 0);
      const av = avg.filter(x => x != null && x > 0);
      return { nr: s.nr, name: s.name, ringe, avg, pfeile: o.pfeile.slice(), gesamt: ringeSum || null,
        avgGesamt: av.length ? av.reduce((a, b) => a + b, 0) / av.length : null,
        misses: o.misses, saetze: o.pfeile.reduce((a, b) => a + b, 0) / 2, matches: o.matches, dist: o.dist };
    });

    const team = { ringe: [], avgPfeil: [], avgSatz: [], saetze: satzTag.slice() };
    TAGE.forEach((t, i) => {
      const r = rows.reduce((a, x) => a + (x.ringe[i] || 0), 0);
      const av = rows.map(x => x.avg[i]).filter(x => x != null && x > 0);
      const a16 = av.length ? av.reduce((a, b) => a + b, 0) / av.length : 0;
      team.ringe.push(r || null);
      team.avgPfeil.push(a16 > 0 ? a16 : null);
      team.avgSatz.push(a16 > 0 && satzTag[i] ? r2(r / satzTag[i]) : null);
    });
    const mean = a => { const b = a.filter(x => x != null && x > 0); return b.length ? b.reduce((x, y) => x + y, 0) / b.length : null; };
    team.gesamtRinge = team.ringe.reduce((a, b) => a + (b || 0), 0) || null;
    team.gesamtAvgPfeil = mean(team.avgPfeil);   // korrigiert: Mittel der vier Tagesschnitte
    team.gesamtAvgSatz = mean(team.avgSatz);

    /* Mannschaftsergebnisse aus den Zetteln (Satz- und Matchpunkte), soweit vorhanden */
    team.tage = TAGE.map(t => {
      const ms = matches.filter(m => m.tag === t);
      const mp = ms.filter(m => m.own && m.own.matchPoints != null).reduce((a, m) => a + m.own.matchPoints, 0);
      const mpN = ms.filter(m => m.own && m.own.matchPoints != null).length;
      return { tag: t, matches: ms.length, matchpunkte: mpN ? mp : null, bekannt: mpN };
    });
    return { rows, team };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Calc; else root.Calc = Calc;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Verschlüsselung der veröffentlichten Daten: Passwort -> PBKDF2-SHA256 -> AES-256-GCM (Web Crypto) */
(function (root) {
  'use strict';
  const Pub = {};
  const ITER = 250000;
  const subtle = () => (root.crypto && root.crypto.subtle) || null;

  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function key(password, salt, iter, usage) {
    const enc = new TextEncoder();
    const km = await subtle().importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, [usage]);
  }

  Pub.encrypt = async function (obj, password) {
    if (!subtle()) throw new Error('Verschlüsselung ist in diesem Browser nur über HTTPS verfügbar.');
    const salt = root.crypto.getRandomValues(new Uint8Array(16)), iv = root.crypto.getRandomValues(new Uint8Array(12));
    const k = await key(password, salt, ITER, 'encrypt');
    const ct = await subtle().encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
    return { v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  };

  Pub.decrypt = async function (file, password) {
    if (!subtle()) throw new Error('Entschlüsselung ist in diesem Browser nur über HTTPS verfügbar.');
    if (!file || file.v !== 1) throw new Error('Unbekanntes Dateiformat.');
    const k = await key(password, unb64(file.salt), file.iter, 'decrypt');
    let pt;
    try { pt = await subtle().decrypt({ name: 'AES-GCM', iv: unb64(file.iv) }, k, unb64(file.ct)); }
    catch (e) { throw new Error('Passwort falsch'); }
    return JSON.parse(new TextDecoder().decode(pt));
  };

  /* Gespeicherten Datensatz der App auf das Nötige für die Ansichtsseite verkleinern */
  Pub.compact = function (rec) {
    let k = 0;
    for (let s = 0; s < 5; s++) { if (rec.shooters.every(S => S.sets[s][0] != null && S.sets[s][1] != null)) k++; else break; }
    const own = rec.teams[rec.ownIdx], opp = rec.teams[1 - rec.ownIdx];
    const side = T => ({ setTotals: T.setTotals.slice(0, k), setPoints: T.setPoints, matchPoints: T.matchPoints });
    return { tag: rec.tag, matchNr: rec.matchNr, gegner: rec.gegner || '', k, own: side(own), opp: side(opp),
      shooters: rec.shooters.map(S => ({ nr: S.nr, sets: S.sets.slice(0, k).map(p => [p[0], p[1]]) })) };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Pub; else root.Pub = Pub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Kleine SVG-Diagramme ohne Bibliothek (laufen offline, gleich auf Android und iPhone) */
(function (root) {
  'use strict';
  const Charts = {};
  /* farbenblindengeeignete Palette, zusätzlich unterscheiden sich die Markerformen */
  Charts.COLORS = ['#0072B2', '#D55E00', '#009E73', '#CC79A7', '#E69F00', '#56B4E9', '#7A5195', '#6B6B6B'];
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmt = v => (Math.round(v * 100) / 100).toString().replace('.', ',');

  function marker(i, x, y, c, title) {
    x = +x; y = +y;
    const t = `<title>${esc(title)}</title>`;
    switch (i % 4) {
      case 0: return `<circle cx="${x}" cy="${y}" r="3.6" fill="${c}">${t}</circle>`;
      case 1: return `<rect x="${x - 3.4}" y="${y - 3.4}" width="6.8" height="6.8" fill="${c}">${t}</rect>`;
      case 2: return `<path d="M${x} ${y - 4.4} L${x + 4.2} ${y + 3.4} L${x - 4.2} ${y + 3.4} Z" fill="${c}">${t}</path>`;
      default: return `<path d="M${x} ${y - 4.6} L${x + 4.2} ${y} L${x} ${y + 4.6} L${x - 4.2} ${y} Z" fill="${c}">${t}</path>`;
    }
  }

  /* opts: {xLabels, series:[{name, values:[number|null]}], yMin, yMax, yStep, w, h, xTitle, yTitle, decimals} */
  Charts.line = function (o) {
    const W = o.w || 360, H = o.h || 230, L = 38, R = 20, T = 12, B = 34;
    const n = o.xLabels.length, pw = W - L - R, ph = H - T - B;
    const x = i => L + (n === 1 ? pw / 2 : (pw * i) / (n - 1)), y = v => T + ph - ((v - o.yMin) / (o.yMax - o.yMin)) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(o.title || 'Diagramm')}" style="width:100%;height:auto">`;
    for (let v = o.yMin; v <= o.yMax + 1e-9; v += o.yStep) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#d5dde5" stroke-width="1"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5a6b7b">${fmt(v)}</text>`;
    }
    o.xLabels.forEach((lab, i) => { s += `<text x="${x(i)}" y="${H - B + 15}" text-anchor="middle" font-size="11" fill="#5a6b7b">${esc(lab)}</text>`; });
    if (o.xTitle) s += `<text x="${L + pw / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#5a6b7b">${esc(o.xTitle)}</text>`;
    o.series.forEach((se, si) => {
      const c = Charts.COLORS[si % Charts.COLORS.length]; let d = '', pen = false, marks = '';
      se.values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        const px = x(i), py = y(Math.max(o.yMin, Math.min(o.yMax, v)));
        d += (pen ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1) + ' '; pen = true;
        marks += marker(si, px.toFixed(1), py.toFixed(1), c, `${se.name}, ${o.xLabels[i]}: ${fmt(v)}`);
      });
      s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>${marks}`;
    });
    return s + '</svg>';
  };

  /* opts: {labels, values, w, h, color} (Balken, z. B. Pfeilverteilung) */
  Charts.bars = function (o) {
    const W = o.w || 360, H = o.h || 200, L = 34, R = 10, T = 14, B = 28;
    const n = o.labels.length, pw = W - L - R, ph = H - T - B, max = Math.max(1, ...o.values);
    const bw = pw / n;
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(o.title || 'Diagramm')}" style="width:100%;height:auto">`;
    const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : max <= 80 ? 10 : 20;
    for (let v = 0; v <= max + 1e-9; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${T + ph - (v / max) * ph}" y2="${T + ph - (v / max) * ph}" stroke="#d5dde5"/><text x="${L - 5}" y="${T + ph - (v / max) * ph + 4}" text-anchor="end" font-size="11" fill="#5a6b7b">${v}</text>`;
    o.values.forEach((v, i) => {
      const bh = (v / max) * ph, bx = L + i * bw + bw * 0.15;
      s += `<rect x="${bx}" y="${T + ph - bh}" width="${bw * 0.7}" height="${bh}" fill="${o.color || Charts.COLORS[0]}"><title>${esc(o.labels[i])}: ${v}</title></rect>`;
      if (v > 0) s += `<text x="${bx + bw * 0.35}" y="${T + ph - bh - 3}" text-anchor="middle" font-size="10" fill="#1b2733">${v}</text>`;
      s += `<text x="${bx + bw * 0.35}" y="${H - B + 15}" text-anchor="middle" font-size="11" fill="#5a6b7b">${esc(o.labels[i])}</text>`;
    });
    return s + '</svg>';
  };

  Charts.legend = names => '<div class="legend">' + names.map((nm, i) => `<span><svg width="16" height="12" viewBox="0 0 16 12">${marker(i, 8, 6, Charts.COLORS[i % Charts.COLORS.length], nm)}</svg> ${esc(nm)}</span>`).join('') + '</div>';

  if (typeof module !== 'undefined' && module.exports) module.exports = Charts; else root.Charts = Charts;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const n = (v, d) => (v == null || (typeof v === 'number' && isNaN(v)) ? '–' : Number(v).toFixed(d == null ? 0 : d).replace('.', ','));
let DATA = null, RES = null;

/* ---------- Anmeldung ---------- */
async function load(pw) {
  const r = await fetch('daten.enc.json?' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 404 ? 'Es sind noch keine Daten veröffentlicht.' : 'Die Daten konnten nicht geladen werden (HTTP ' + r.status + ').');
  DATA = await Pub.decrypt(await r.json(), pw);
}
async function login(pw, remember) {
  const msg = $('#loginMsg'); msg.textContent = '';
  try {
    await load(pw);
    if (remember) LS.set('bl_pw', pw); else LS.del('bl_pw');
    $('#login').hidden = true; $('#app').hidden = false; $('#nav').hidden = false;
    render();
  } catch (e) { msg.textContent = e.message; LS.del('bl_pw'); $('#login').hidden = false; }
}
$('#btnLogin').onclick = () => { const pw = $('#pw').value; if (pw) login(pw, $('#merken').checked); };
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });
$('#btnLogout').onclick = () => { LS.del('bl_pw'); location.reload(); };
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(t) {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  ['schuetzen', 'spieltage', 'diagramme'].forEach(k => { $('#tab-' + k).hidden = (k !== t); });
  window.scrollTo(0, 0);
}

/* ---------- Anzeige ---------- */
function render() {
  RES = Calc.compute(DATA.matches, DATA.schuetzen);
  $('#titel').textContent = `${DATA.verein || 'Bayernliga'} · Saison ${DATA.saison || ''}`.trim();
  $('#foot').textContent = `Stand: ${new Date(DATA.erzeugt).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' })} · Angaben ohne Gewähr`;
  renderSchuetzen(); renderSpieltage(); renderDiagramme();
}
const nameCell = r => `<td class="nm" data-nr="${r.nr}">${h(r.name)}</td>`;

function renderSchuetzen() {
  const R = RES.rows, T = RES.team;
  const head = a => '<thead><tr><th>Schütze</th>' + a.map(x => `<th>${x}</th>`).join('') + '</tr></thead>';
  $('#tRinge').innerHTML = '<table class="t">' + head(['Gesamt', 'Tag 1', 'Tag 2', 'Tag 3', 'Tag 4']) + '<tbody>' +
    R.map(r => `<tr>${nameCell(r)}<td><b>${n(r.gesamt)}</b></td>${r.ringe.map(v => `<td>${n(v)}</td>`).join('')}</tr>`).join('') +
    `</tbody><tfoot><tr><td>Team</td><td>${n(T.gesamtRinge)}</td>${T.ringe.map(v => `<td>${n(v)}</td>`).join('')}</tr></tfoot></table>`;
  $('#tSchnitt').innerHTML = '<table class="t">' + head(['Gesamt', 'Tag 1', 'Tag 2', 'Tag 3', 'Tag 4']) + '<tbody>' +
    R.map(r => `<tr>${nameCell(r)}<td><b>${n(r.avgGesamt, 2)}</b></td>${r.avg.map(v => `<td>${n(v, 2)}</td>`).join('')}</tr>`).join('') +
    `</tbody><tfoot><tr><td>Team</td><td>${n(T.gesamtAvgPfeil, 2)}</td>${T.avgPfeil.map(v => `<td>${n(v, 2)}</td>`).join('')}</tr></tfoot></table>`;
  $('#tStat').innerHTML = '<table class="t">' + head(['Misses', 'Sätze', 'Matches']) + '<tbody>' +
    R.map(r => `<tr>${nameCell(r)}<td>${n(r.misses)}</td><td>${n(r.saetze, r.saetze % 1 ? 1 : 0)}</td><td>${n(r.matches)}</td></tr>`).join('') + '</tbody></table>';
  $('#satzInfo').textContent = `Team: Ø Ringe je Satz (6 Pfeile) – Tag 1: ${n(T.avgSatz[0], 2)}, Tag 2: ${n(T.avgSatz[1], 2)}, Tag 3: ${n(T.avgSatz[2], 2)}, Tag 4: ${n(T.avgSatz[3], 2)}, Gesamt: ${n(T.gesamtAvgSatz, 2)}.`;
  document.querySelectorAll('td.nm').forEach(td => td.addEventListener('click', () => { $('#selSchuetze').value = td.dataset.nr; drawVert(); showTab('diagramme'); }));
}

const nameOf = nr => { const s = DATA.schuetzen.find(x => +x.nr === +nr); return s ? s.name : 'Nr. ' + nr; };
function renderSpieltage() {
  const out = [];
  for (let t = 1; t <= 4; t++) {
    const ms = DATA.matches.filter(m => m.tag === t).sort((a, b) => a.matchNr - b.matchNr);
    if (!ms.length) continue;
    const info = RES.team.tage[t - 1];
    let html = `<div class="card"><h2>Spieltag ${t}${info.matchpunkte != null ? ` · ${info.matchpunkte} Matchpunkte${info.bekannt < ms.length ? ` (aus ${info.bekannt} von ${ms.length} Matches)` : ''}` : ''} <span class="klein">(${ms.length} Matches)</span></h2>`;
    ms.forEach(m => {
      const k = m.k || (m.shooters[0] ? m.shooters[0].sets.length : 0);
      const sp = m.own && m.own.setPoints != null && m.opp && m.opp.setPoints != null ? ` · ${m.own.setPoints}:${m.opp.setPoints} Sätze` : '';
      const mp = m.own && m.own.matchPoints != null && m.opp && m.opp.matchPoints != null ? ` · ${m.own.matchPoints}:${m.opp.matchPoints} Punkte` : '';
      const teamSet = i => m.shooters.reduce((a, S) => a + (S.sets[i] ? S.sets[i][0] + S.sets[i][1] : 0), 0);
      let tb = '<div class="scroll"><table class="t"><thead><tr><th>Schütze</th>' + Array.from({ length: k }, (_, i) => `<th>Satz ${i + 1}</th>`).join('') + '<th>Σ</th></tr></thead><tbody>';
      m.shooters.forEach(S => {
        const sum = S.sets.reduce((a, p) => a + p[0] + p[1], 0);
        tb += `<tr><td>${h(nameOf(S.nr))}</td>${S.sets.map(p => `<td>${p[0]} · ${p[1]}</td>`).join('')}<td><b>${sum}</b></td></tr>`;
      });
      tb += `</tbody><tfoot><tr><td>Team</td>${Array.from({ length: k }, (_, i) => `<td>${teamSet(i)}</td>`).join('')}<td>${Array.from({ length: k }, (_, i) => teamSet(i)).reduce((a, b) => a + b, 0)}</td></tr>`;
      if (m.opp && m.opp.setTotals && m.opp.setTotals.length && m.opp.setTotals.every(v => v != null)) tb += `<tr><td>${h(m.gegner || 'Gegner')}</td>${m.opp.setTotals.map(v => `<td>${v}</td>`).join('')}<td>${m.opp.setTotals.reduce((a, b) => a + b, 0)}</td></tr>`;
      tb += '</tfoot></table></div>';
      html += `<details><summary>Match ${m.matchNr} · ${h(m.gegner || '–')} <small class="erg">${sp}${mp}</small></summary>${tb}</details>`;
    });
    out.push(html + '</div>');
  }
  $('#spieltage').innerHTML = out.join('') || '<div class="card">Noch keine Spieltage veröffentlicht.</div>';
}

function renderDiagramme() {
  const tags = [...new Set(DATA.matches.map(m => m.tag))].sort((a, b) => a - b);
  $('#selTag').innerHTML = tags.map(t => `<option value="${t}">Spieltag ${t}</option>`).join('');
  const fillMatch = () => {
    const ms = DATA.matches.filter(m => m.tag === +$('#selTag').value).sort((a, b) => a.matchNr - b.matchNr);
    $('#selMatch').innerHTML = ms.map(m => `<option value="${m.matchNr}">Match ${m.matchNr}${m.gegner ? ' · ' + h(m.gegner) : ''}</option>`).join('');
    drawMatch();
  };
  $('#selTag').onchange = fillMatch; $('#selMatch').onchange = drawMatch;
  $('#selSchuetze').innerHTML = RES.rows.map(r => `<option value="${r.nr}">${h(r.name)}</option>`).join('');
  $('#selSchuetze').onchange = drawVert;
  fillMatch(); drawTage(); drawVert();
}
function drawMatch() {
  const m = DATA.matches.find(x => x.tag === +$('#selTag').value && x.matchNr === +$('#selMatch').value);
  if (!m) { $('#chMatch').innerHTML = '<div class="klein">Keine Daten.</div>'; return; }
  const series = m.shooters.map(S => ({ name: nameOf(S.nr), values: S.sets.flat() }));
  const all = series.flatMap(s => s.values).filter(v => v != null);
  const yMin = Math.min(5, Math.min(...all));
  const len = Math.max(...series.map(s => s.values.length));
  $('#chMatch').innerHTML = Charts.line({ xLabels: Array.from({ length: len }, (_, i) => String(i + 1)), series, yMin, yMax: 10, yStep: 1, xTitle: 'Pfeil (2 je Satz)', title: 'Pfeilwerte im Match' }) + Charts.legend(series.map(s => s.name));
}
function drawTage() {
  const series = RES.rows.filter(r => r.avg.some(v => v != null)).map(r => ({ name: r.name, values: r.avg }));
  series.push({ name: 'Team', values: RES.team.avgPfeil });
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length) { $('#chTage').innerHTML = '<div class="klein">Keine Daten.</div>'; return; }
  const yMin = Math.max(0, Math.floor(Math.min(...all) * 2) / 2 - 0.5), yMax = Math.min(10, Math.ceil(Math.max(...all) * 2) / 2 + 0.5);
  $('#chTage').innerHTML = Charts.line({ xLabels: ['Tag 1', 'Tag 2', 'Tag 3', 'Tag 4'], series, yMin, yMax, yStep: 0.5, title: 'Ø Ringe je Pfeil nach Spieltag' }) + Charts.legend(series.map(s => s.name));
}
function drawVert() {
  const r = RES.rows.find(x => x.nr === +$('#selSchuetze').value);
  if (!r) return;
  const tot = r.dist.reduce((a, b) => a + b, 0);
  $('#chVert').innerHTML = Charts.bars({ labels: r.dist.map((_, i) => String(i)), values: r.dist, title: 'Pfeilverteilung ' + r.name });
  $('#vertInfo').textContent = tot ? `${tot} Pfeile · ${n(100 * (r.dist[10] || 0) / tot, 1)} % Zehner · ${n(100 * ((r.dist[10] || 0) + (r.dist[9] || 0)) / tot, 1)} % Neuner oder Zehner · ${r.misses} Fehlschüsse` : '';
}

/* Automatisch anmelden, wenn auf diesem Gerät gemerkt */
(function () { const pw = LS.get('bl_pw'); if (pw) login(pw, true); })();
</script>
